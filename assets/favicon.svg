<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background gradient: dark navy, radial highlight top-left -->
    <radialGradient id="bg" cx="28%" cy="28%" r="72%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D2845"/>
      <stop offset="100%" stop-color="#050F1A"/>
    </radialGradient>
    <!-- Brand blue gradient (matches --blue-light → --blue) -->
    <linearGradient id="g" x1="8" y1="18" x2="92" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5FA8FF"/>
      <stop offset="100%" stop-color="#1E6FE1"/>
    </linearGradient>
    <!-- Subtle glow behind letters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background card -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Border glow -->
  <rect x="1" y="1" width="98" height="98" rx="19" stroke="url(#g)" stroke-width="1.5" stroke-opacity="0.28"/>

  <!-- Top-right accent pixel cluster -->
  <rect x="69" y="11" width="8" height="8" rx="2" fill="#1E6FE1" fill-opacity="0.55"/>
  <rect x="80" y="11" width="5" height="5" rx="1.5" fill="#5FA8FF" fill-opacity="0.35"/>
  <rect x="69" y="22" width="5" height="5" rx="1.5" fill="#5FA8FF" fill-opacity="0.25"/>

  <!-- NQ monogram -->
  <text
    x="49"
    y="63"
    text-anchor="middle"
    font-family="'Bricolage Grotesque', Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-weight="800"
    font-size="40"
    letter-spacing="-2"
    fill="url(#g)"
    filter="url(#glow)"
  >NQ</text>

  <!-- Underline accent bar -->
  <rect x="26" y="72" width="48" height="2.5" rx="1.25" fill="url(#g)" opacity="0.55"/>
</svg>
